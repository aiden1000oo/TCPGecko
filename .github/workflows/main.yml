name: Build Gecko OS

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitppc:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure devkitPPC
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITPPC=/opt/devkitpro/devkitPPC
          export PATH="$DEVKITPPC/bin:$DEVKITPRO/tools/bin:$PATH"

          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITPPC=$DEVKITPPC"
          echo "$PATH"

          ls -la "$DEVKITPPC/bin"
          powerpc-eabi-gcc --version

      - name: Build Gecko OS
        working-directory: Gecko_src
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITPPC=/opt/devkitpro/devkitPPC
          export PATH="$DEVKITPPC/bin:$DEVKITPRO/tools/bin:$PATH"

          make clean
          make

      - name: Show output
        working-directory: Gecko_src
        run: |
          ls -lh boot.*
          file boot.elf boot.dol

      - name: Upload Gecko OS
        uses: actions/upload-artifact@v4
        with:
          name: GeckoOS
          path: |
            Gecko_src/boot.elf
            Gecko_src/boot.dol
